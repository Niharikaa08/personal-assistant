[theme]
base = "light"
primaryColor = "#2F4CC4"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2233"
borderColor = "#E2E6ED"
baseRadius = "10px"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[server]
headless = true
